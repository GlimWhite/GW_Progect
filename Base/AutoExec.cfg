//#######################################################//
//#					НАСТРОЙКА ПРИ ЗАПУСКЕ				#//
//#######################################################//
//#	ЭКРАН
//########################################
seta	r_customwidth 	"1920"									 
seta 	r_customheight 	"1080"
seta 	r_fullscreen 	"1"		// Рекомендую включить полноэкранный режим для производительности
seta	r_picmip		"0"		// 0 = максимальное качество текстур
seta	r_mode			"-1"
seta	r_displayRefresh "144"	// Установи частоту обновления своего монитора (например, 60, 144, 165)

//#######################
//#	НАСТРОЙКА НОВОГО МЕНЮ
//#######################
seta 	ui_menuFiles "ui/menu.txt"
seta 	cg_hudFiles "ui/hud.txt"
seta 	ui_prisonerobj_maxtotal 16

//#######################
//#	НАСТРОЙКИ ПРОИЗВОДИТЕЛЬНОСТИ
//#######################
seta 	com_maxfps		"125"		// Ограничение FPS (125 — стандарт для физики Quake 3, можно поставить выше)
seta	r_swapinterval		"0"		// 0 = отключить V-Sync (повышает FPS, но может вызвать разрывы)
seta	r_allowsoftwaregl	"0"		// Отключить программный рендеринг
seta	r_finish		"0"		// Отключить синхронизацию glFinish (немного повышает FPS)
seta	r_lodscale		"4"		// Качество LOD (4 = макс., 0 = мин.)
seta	r_lodcurveerror		"250"		// Удаление полигонов на расстоянии
seta	r_faceplanecull		"1"		// Удаление невидимых поверхностей (оставить включенным)

//#######################################################################//
//#						НАСТРОЙКИ КАЧЕСТВА И ГЕЙМПЛЕЯ					#//	
//#######################################################################//
seta 	cl_anglespeedkey 		"1.5"
seta	cl_nodelta 		 	"1"
seta	cl_noprint			"0"
seta 	g_sabermorerealistic 		"2"		// Реалистичный урон меча
seta  	g_dismemberprobabilities 	"100"	// Шанс отрубания конечностей
seta	g_dismemberment			"3"		// Разрешить отрубание головы и торса
seta	broadsword			"1"		// Включить рэгдолл (физику мягких тел)
seta	g_corpseRemovalTime		"0"		// 0 = трупы не исчезают (для реализма)
seta	cm_playercurveclip		"0"
seta	g_gravity			"800"
seta	g_speed				"280"
seta	r_DynamicGlow			"1"		// Динамическое свечение (для мечей и эффектов)
seta	r_weatherScale 			"1"
seta	r_detailtextures		"1"
seta	r_drawentities			"1"
seta	r_drawsun			"1"
seta	r_fastsky			"0"		// Небо отображается
seta	r_znear				"5"
seta	handicap			"100"		// 100 = нормальный урон (было 200, что давало штраф)
seta	helpusobi 			"1"
seta 	g_spskill			"0"
seta	cg_crosshairForceHint		"0"
seta	cg_fov				"97"		// Угол обзора для широкоэкранных мониторов

//#	НАСТРОЙКИ ДОБАВЛЕНЫЕ В МЕНЮ (раскомментируй при необходимости)
//########################################
