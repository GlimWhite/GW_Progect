//seta 	cl_VideoQuality 		"1"
//seta	r_ext_multitexture 		"1"
//seta	r_ext_compiled_vertex_array	"1"
//seta	r_ext_texture_env_add		"1"
//seta	r_depthbits 			"24"

seta	version 	"Jedi Academy: Redux version 2.0"
seta	gamedate	"31 December 2024"
seta	gamename	"Redux"

//#######################################################//
//#					НАСТРОЙКА КАМЕРЫ					#//	
//#######################################################//
seta cg_thirdpersonrange "60"

bind N 		vstr Plus
set	 Plus 	vstr Plus0
//Массив
set  Plus0  "cg_thirdpersonrange 60;	set plus vstr plus1"
set  Plus1  "cg_thirdpersonrange 80;   	set plus vstr plus2"
set  Plus2  "cg_thirdpersonrange 100;  	set plus vstr plus3"
set  Plus3  "cg_thirdpersonrange 120; 	set plus vstr plus4"
set  Plus4  "cg_thirdpersonrange 130;  	set plus vstr plus5"
set  Plus5  "cg_thirdpersonrange 140;  	set plus vstr plus6"
set  Plus6  "cg_thirdpersonrange 150;  	set plus vstr plus7"
set  Plus7  "cg_thirdpersonrange 160;  	set plus vstr plus8"
set  Plus8  "cg_thirdpersonrange 180;  	set plus vstr plus9"
set  Plus9  "cg_thirdpersonrange 160;  	set plus vstr plus10"
set  Plus10 "cg_thirdpersonrange 150;  	set plus vstr plus11"
set  Plus11 "cg_thirdpersonrange 140;  	set plus vstr plus12"
set  Plus12 "cg_thirdpersonrange 130;  	set plus vstr plus13"
set  Plus13 "cg_thirdpersonrange 120;  	set plus vstr plus14"
set  Plus14 "cg_thirdpersonrange 100;  	set plus vstr plus15"
set  Plus15 "cg_thirdpersonrange 80;  	set plus vstr plus16"
set  Plus16 "cg_thirdpersonrange 60; 	set plus vstr plus1" // Исправлено: цикл замыкается на Plus1 (80), чтобы избежать задержки на 60
